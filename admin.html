<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Sean Top Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4efea;
            background-image: radial-gradient(#d6cfc7 1px, transparent 1px);
            background-size: 20px 20px;
            color: #111827;
        }
        .font-mono-saweria { font-family: 'Space Mono', monospace; }
        .neo-card {
            background-color: #ffffff;
            border: 3px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            border-radius: 14px;
        }
        .neo-btn {
            border: 2.5px solid #000000;
            box-shadow: 3px 3px 0px #000000;
            border-radius: 10px;
            transition: all 0.1s ease;
        }
        .neo-btn:hover {
            transform: translate(1.5px, 1.5px);
            box-shadow: 1.5px 1.5px 0px #000000;
        }
        .neo-input {
            background-color: #ffffff;
            border: 2px solid #000000;
            border-radius: 8px;
        }
        .neo-input:focus {
            outline: none;
            background-color: #fffbeb;
            box-shadow: 3px 3px 0px #000000;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Navbar -->
    <nav class="max-w-6xl mx-auto px-4 pt-5">
        <div class="neo-card bg-[#fff9eb] px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-[#f582ae] border-2 border-black rounded-lg flex items-center justify-center shadow-[2px_2px_0px_#000]">
                    <i class="fa-solid fa-user-shield text-black"></i>
                </div>
                <span class="font-extrabold text-lg">SEAN<span class="bg-[#faae2b] px-1.5 border border-black rounded ml-1">ADMIN</span></span>
            </div>
            <div class="flex items-center gap-3">
                <a href="/" class="neo-btn bg-white px-3 py-1.5 text-xs font-bold">
                    <i class="fa-solid fa-store mr-1"></i> Lihat Toko
                </a>
                <button id="btnLogout" onclick="logout()" class="hidden neo-btn bg-[#f582ae] text-black px-3 py-1.5 text-xs font-bold">
                    Keluar
                </button>
            </div>
        </div>
    </nav>

    <!-- LOGIN ADMIN -->
    <div id="loginSection" class="max-w-md mx-auto mt-16 px-4">
        <div class="neo-card bg-[#fff9eb] p-6">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-[#faae2b] border-2 border-black shadow-[3px_3px_0px_#000] rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">
                    🔑
                </div>
                <h1 class="text-xl font-extrabold">Login Admin Sean Top Up</h1>
                <p class="text-xs text-gray-600 mt-1 font-medium">Masukkan password untuk mengatur harga & memantau transaksi</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Password Admin :</label>
                    <input type="password" id="adminPassInput" placeholder="Default: sean123" class="neo-input w-full px-4 py-2.5 text-sm font-bold">
                </div>
                <button onclick="loginAdmin()" class="neo-btn w-full bg-[#faae2b] text-black font-extrabold py-3 text-sm">
                    MASUK DASHBOARD
                </button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD ADMIN -->
    <div id="dashboardSection" class="hidden max-w-6xl mx-auto px-4 mt-8 space-y-8">
        
        <!-- Tambah Produk -->
        <div class="neo-card bg-[#fff9eb] p-6">
            <h2 class="text-base font-extrabold mb-4 inline-block bg-[#8bd3dd] border-2 border-black px-3 py-1 rounded-lg shadow-[2px_2px_0px_#000]">
                ➕ TAMBAH PRODUK BARU
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-5 gap-3">
                <input type="text" id="newName" placeholder="Nama (344 Diamonds)" class="neo-input px-3 py-2 text-sm font-bold">
                <input type="number" id="newPrice" placeholder="Harga (82000)" class="neo-input px-3 py-2 text-sm font-bold">
                <input type="text" id="newSku" placeholder="SKU Digiflazz (ML344)" class="neo-input px-3 py-2 text-sm font-mono-saweria uppercase">
                <select id="newCategory" class="neo-input px-3 py-2 text-sm font-bold">
                    <option value="diamond">Diamond Instan</option>
                    <option value="special">Spesial Pass</option>
                </select>
                <button onclick="addProduct()" class="neo-btn bg-[#faae2b] text-black font-extrabold px-4 py-2 text-sm">
                    + Tambah
                </button>
            </div>
        </div>

        <!-- Tabel Atur Harga -->
        <div class="neo-card p-6">
            <div class="flex flex-wrap justify-between items-center gap-4 mb-5">
                <div>
                    <h2 class="text-base font-extrabold inline-block bg-[#faae2b] border-2 border-black px-3 py-1 rounded-lg shadow-[2px_2px_0px_#000]">
                        🏷️ ATUR HARGA & KODE SKU
                    </h2>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="adjustAllPrices(500)" class="neo-btn bg-white text-xs font-bold px-3 py-2">+ Rp 500 Semua</button>
                    <button onclick="adjustAllPrices(-500)" class="neo-btn bg-white text-xs font-bold px-3 py-2">- Rp 500 Semua</button>
                    <button onclick="saveAllProducts()" class="neo-btn bg-[#8bd3dd] text-black font-extrabold text-xs px-4 py-2">
                        💾 SIMPAN SEMUA PERUBAHAN
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b-2 border-black text-black text-xs uppercase font-extrabold">
                            <th class="py-3 px-2">Nama Produk</th>
                            <th class="py-3 px-2">Kategori</th>
                            <th class="py-3 px-2">SKU Digiflazz</th>
                            <th class="py-3 px-2">Harga Jual (Rp)</th>
                            <th class="py-3 px-2 text-center">Hapus</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>

        <!-- Pantau Pesanan -->
        <div class="neo-card bg-[#fff9eb] p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-extrabold inline-block bg-[#f582ae] border-2 border-black px-3 py-1 rounded-lg shadow-[2px_2px_0px_#000]">
                    🧾 PANTAU PESANAN MASUK
                </h2>
                <button onclick="loadOrders()" class="neo-btn bg-white text-xs font-bold px-3 py-2">
                    🔄 Refresh
                </button>
            </div>

            <div class="overflow-x-auto bg-white border-2 border-black rounded-xl p-2">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b-2 border-black text-xs uppercase font-extrabold">
                            <th class="py-3 px-2">Invoice</th>
                            <th class="py-3 px-2">Akun MLBB</th>
                            <th class="py-3 px-2">Item & SKU</th>
                            <th class="py-3 px-2">Total Unik</th>
                            <th class="py-3 px-2">Status</th>
                            <th class="py-3 px-2 text-center">Aksi Manual</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let adminPassword = '';
        let productsList = [];

        async function loginAdmin() {
            const pass = document.getElementById('adminPassInput').value;
            if (!pass) return;

            const res = await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass, action: 'login' })
            });
            const data = await res.json();

            if (data.success) {
                adminPassword = pass;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('btnLogout').classList.remove('hidden');
                loadProducts();
                loadOrders();
            } else {
                Swal.fire({ icon: 'error', title: 'Password Salah!', text: data.message, confirmButtonColor: '#faae2b' });
            }
        }

        function logout() { location.reload(); }

        async function loadProducts() {
            const res = await fetch('/api/products');
            const data = await res.json();
            productsList = data.products || [];
            renderProducts();
        }

        function renderProducts() {
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';

            productsList.forEach((p, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td class="py-2.5 px-2">
                            <input type="text" value="${p.name}" onchange="updateField(${index}, 'name', this.value)" class="neo-input px-3 py-1.5 text-sm font-bold w-full">
                        </td>
                        <td class="py-2.5 px-2">
                            <select onchange="updateField(${index}, 'category', this.value)" class="neo-input px-2 py-1.5 text-xs font-bold">
                                <option value="diamond" ${p.category === 'diamond' ? 'selected' : ''}>Diamond</option>
                                <option value="special" ${p.category === 'special' ? 'selected' : ''}>Spesial Pass</option>
                            </select>
                        </td>
                        <td class="py-2.5 px-2">
                            <input type="text" value="${p.sku}" onchange="updateField(${index}, 'sku', this.value.toUpperCase())" class="neo-input px-3 py-1.5 text-sm w-28 uppercase font-mono-saweria font-bold">
                        </td>
                        <td class="py-2.5 px-2">
                            <input type="number" value="${p.price}" onchange="updateField(${index}, 'price', parseInt(this.value))" class="neo-input px-3 py-1.5 text-sm w-36 font-mono-saweria font-bold bg-[#fff9eb]">
                        </td>
                        <td class="py-2.5 px-2 text-center">
                            <button onclick="deleteProduct(${index})" class="neo-btn bg-[#f582ae] text-black px-2.5 py-1 text-xs font-bold">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        function updateField(index, field, value) { productsList[index][field] = value; }

        function adjustAllPrices(amount) {
            productsList = productsList.map(p => ({ ...p, price: Math.max(500, parseInt(p.price) + amount) }));
            renderProducts();
        }

        function addProduct() {
            const name = document.getElementById('newName').value.trim();
            const price = parseInt(document.getElementById('newPrice').value);
            const sku = document.getElementById('newSku').value.trim().toUpperCase();
            const category = document.getElementById('newCategory').value;

            if (!name || !price || !sku) return;
            productsList.push({ id: Date.now(), name, price, sku, category, badge: '' });
            document.getElementById('newName').value = '';
            document.getElementById('newPrice').value = '';
            document.getElementById('newSku').value = '';
            renderProducts();
            saveAllProducts();
        }

        function deleteProduct(index) {
            productsList.splice(index, 1);
            renderProducts();
        }

        async function saveAllProducts() {
            const res = await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPassword, products: productsList })
            });
            const data = await res.json();
            Swal.fire({ icon: data.success ? 'success' : 'error', title: data.message, timer: 1500, confirmButtonColor: '#faae2b' });
        }

        async function loadOrders() {
            const res = await fetch(`/api/order?action=list&password=${encodeURIComponent(adminPassword)}`);
            const data = await res.json();
            const tbody = document.getElementById('orderTableBody');

            if (!data.orders || data.orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-gray-500 font-bold">Belum ada pesanan masuk</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.orders.forEach(o => {
                const badge = o.status === 'PAID'
                    ? '<span class="bg-[#8bd3dd] border border-black px-2 py-0.5 rounded text-xs font-extrabold">LUNAS</span>'
                    : '<span class="bg-[#faae2b] border border-black px-2 py-0.5 rounded text-xs font-extrabold">PENDING</span>';

                const btnAction = o.status === 'PENDING'
                    ? `<button onclick="approveOrder(${o.totalPrice})" class="neo-btn bg-[#8bd3dd] text-black font-extrabold px-3 py-1 text-xs">Proses Digiflazz</button>`
                    : `<span class="text-xs font-bold text-gray-500">Selesai ✓</span>`;

                tbody.innerHTML += `
                    <tr class="border-b border-gray-200">
                        <td class="py-3 px-2 font-mono-saweria font-bold text-xs">${o.invoiceId}</td>
                        <td class="py-3 px-2 font-bold">${o.nickname} <br><span class="text-xs text-gray-500">${o.userId} (${o.zoneId})</span></td>
                        <td class="py-3 px-2 font-bold">${o.item} <span class="text-xs font-mono-saweria">[${o.sku}]</span></td>
                        <td class="py-3 px-2 font-mono-saweria font-bold">Rp ${o.totalPrice.toLocaleString('id-ID')}</td>
                        <td class="py-3 px-2">${badge}</td>
                        <td class="py-3 px-2 text-center">${btnAction}</td>
                    </tr>
                `;
            });
        }

        async function approveOrder(totalPrice) {
            const res = await fetch('/api/order?action=approve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPassword, totalPrice })
            });
            const data = await res.json();
            Swal.fire({ icon: 'success', title: 'Diproses!', text: data.message, confirmButtonColor: '#faae2b' });
            loadOrders();
        }
    </script>
</body>
</html>
